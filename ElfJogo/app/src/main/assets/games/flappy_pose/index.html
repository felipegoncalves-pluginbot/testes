<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flappy Pose Kinect</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #70c5ce; font-family: 'Segoe UI', Roboto, sans-serif; }
        #canvas { display: block; width: 100vw; height: 100vh; }
        #score-box {
            position: absolute; top: 20px; left: 50%;
            -webkit-transform: translateX(-50%); transform: translateX(-50%);
            font-size: 52px; font-weight: bold; color: #fff; text-shadow: 0 4px 10px rgba(0,0,0,0.6);
            pointer-events: none; z-index: 5;
        }
        #instruction {
            position: absolute; bottom: 20px; left: 50%;
            -webkit-transform: translateX(-50%); transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: #ffeb3b; padding: 10px 24px; border-radius: 20px;
            font-size: 20px; font-weight: bold; pointer-events: none;
        }
        #game-over-box {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8);
            display: none;
            -webkit-flex-direction: column; flex-direction: column;
            -webkit-justify-content: center; justify-content: center;
            -webkit-align-items: center; align-items: center;
            color: #fff; z-index: 10;
        }
        #restart-btn {
            background: #4caf50; color: #fff; border: none; padding: 14px 36px;
            font-size: 22px; font-weight: bold; border-radius: 30px; cursor: pointer; margin-top: 20px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="score-box">0</div>
    <div id="instruction">BATA OS BRAÇOS OU PULE PARA VOAR! 🕊️</div>

    <div id="game-over-box">
        <h1 style="font-size: 46px; color: #f44336;">GAME OVER!</h1>
        <p id="final-score" style="font-size: 26px; color: #ffeb3b; margin-top: 10px;">PONTOS: 0</p>
        <button id="restart-btn" onclick="restart()">TENTAR DE NOVO</button>
    </div>

    <script>
        'use strict';

        var canvas = document.getElementById('canvas');
        var ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth || 800;
            canvas.height = window.innerHeight || 480;
        }
        window.addEventListener('resize', resize);
        resize();

        var birdY = canvas.height * 0.5;
        var birdVy = 0;
        var gravity = 0.42;
        var jumpForce = -8.5;

        var score = 0;
        var gameOver = false;
        var pipes = [];
        var pipeTimer = 0;

        function flap() {
            if (gameOver) return;
            birdVy = jumpForce;
        }

        window.addEventListener('touchstart', flap);
        window.addEventListener('mousedown', flap);

        // Entrada via Kinect (Injetada pelo Android Java)
        window.onKinectFrame = function(data) {
            if (!data || !data.isPlayerPresent) return;
            if (data.gesture === 'SWING_UP' || data.gesture === 'JUMP' || data.isJumping || data.isLeftHandRaised || data.isRightHandRaised) {
                flap();
            }
        };

        function spawnPipe() {
            var gap = 200;
            var topHeight = 60 + Math.random() * (canvas.height - gap - 160);
            pipes.push({
                x: canvas.width,
                top: topHeight,
                bottom: topHeight + gap,
                passed: false
            });
        }

        function restart() {
            birdY = canvas.height * 0.5;
            birdVy = 0;
            score = 0;
            gameOver = false;
            pipes.length = 0;
            document.getElementById('score-box').innerText = '0';
            document.getElementById('game-over-box').style.display = 'none';
        }

        function endGame() {
            gameOver = true;
            document.getElementById('final-score').innerText = 'PONTOS: ' + score;
            document.getElementById('game-over-box').style.display = 'flex';
            if (window.KinectBridge && window.KinectBridge.onGameOver) {
                window.KinectBridge.onGameOver(score);
            }
        }

        function render() {
            // Céu
            ctx.fillStyle = '#70c5ce';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Chão
            ctx.fillStyle = '#ded895';
            ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
            ctx.fillStyle = '#5ee270';
            ctx.fillRect(0, canvas.height - 40, canvas.width, 10);

            if (!gameOver) {
                birdVy += gravity;
                birdY += birdVy;

                if (birdY > canvas.height - 65 || birdY < 15) {
                    endGame();
                }

                pipeTimer++;
                if (pipeTimer > 100) {
                    spawnPipe();
                    pipeTimer = 0;
                }
            }

            // Canos
            ctx.fillStyle = '#73bf2e';
            ctx.strokeStyle = '#558022';
            ctx.lineWidth = 4;

            for (var i = pipes.length - 1; i >= 0; i--) {
                var p = pipes[i];
                if (!gameOver) p.x -= 3.5;

                // Cano Superior
                ctx.fillRect(p.x, 0, 70, p.top);
                ctx.strokeRect(p.x, 0, 70, p.top);

                // Cano Inferior
                ctx.fillRect(p.x, p.bottom, 70, canvas.height - p.bottom);
                ctx.strokeRect(p.x, p.bottom, 70, canvas.height - p.bottom);

                // Colisão
                var birdX = canvas.width * 0.3;
                if (birdX + 20 > p.x && birdX - 20 < p.x + 70) {
                    if (birdY - 18 < p.top || birdY + 18 > p.bottom) {
                        endGame();
                    }
                }

                if (!p.passed && p.x + 70 < birdX) {
                    p.passed = true;
                    score++;
                    document.getElementById('score-box').innerText = score;
                    if (window.KinectBridge && window.KinectBridge.onScore) {
                        window.KinectBridge.onScore(1, 1);
                    }
                }

                if (p.x < -100) pipes.splice(i, 1);
            }

            // Pássaro Amarelo
            var bx = canvas.width * 0.3;
            ctx.save();
            ctx.translate(bx, birdY);
            ctx.rotate(Math.min(Math.PI / 4, Math.max(-Math.PI / 4, birdVy * 0.06)));

            ctx.fillStyle = '#fbc02d';
            ctx.beginPath();
            ctx.arc(0, 0, 22, 0, Math.PI * 2);
            ctx.fill();

            // Asa
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(-6, 2, 10, 0, Math.PI * 2);
            ctx.fill();

            // Olho
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(10, -6, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(12, -6, 3, 0, Math.PI * 2);
            ctx.fill();

            // Bico
            ctx.fillStyle = '#ff5722';
            ctx.beginPath();
            ctx.moveTo(16, 0);
            ctx.lineTo(28, 4);
            ctx.lineTo(16, 8);
            ctx.fill();

            ctx.restore();

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
